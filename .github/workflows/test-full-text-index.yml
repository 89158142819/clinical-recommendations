
name: Проверка структуры короткой клинической рекомендации

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы проекта
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить библиотеки
        run: pip install requests pypdf

      - name: Извлечь текст и найти разделы
        run: |
          python - <<'PY'
          import requests
          import json
          import re
          from io import BytesIO
          from pypdf import PdfReader

          recommendation_id = "750_2"

          url = (
              "https://apicr.minzdrav.gov.ru/API.ashx"
              f"?op=GetClinrecPdf&id={recommendation_id}"
          )

          print("Загружаем рекомендацию:", recommendation_id)

          response = requests.get(url, timeout=120)
          response.raise_for_status()

          if not response.content.startswith(b"%PDF"):
              raise Exception("Сервер не вернул PDF")

          reader = PdfReader(BytesIO(response.content))

          print("Количество страниц:", len(reader.pages))

          pages = []
          heading_candidates = []

          section_patterns = {
              "definition": [
                  "определение",
                  "определение заболевания"
              ],
              "icd10": [
                  "кодирование по мкб",
                  "мкб-10",
                  "классификация мкб"
              ],
              "laboratory": [
                  "лабораторная диагностика",
                  "лабораторные диагностические исследования"
              ],
              "instrumental": [
                  "инструментальная диагностика",
                  "инструментальные диагностические исследования"
              ],
              "other_diagnostics": [
                  "иная диагностика",
                  "прочие диагностические исследования"
              ],
              "treatment": [
                  "лечение",
                  "терапевтическое лечение",
                  "медикаментозное лечение"
              ]
          }

          total_characters = 0
          empty_pages = []

          for page_number, page in enumerate(reader.pages, start=1):
              raw_text = page.extract_text() or ""

              raw_text = raw_text.replace("\x00", "")
              raw_text = raw_text.replace("\r\n", "\n")
              raw_text = raw_text.replace("\r", "\n")

              total_characters += len(raw_text)

              if not raw_text.strip():
                  empty_pages.append(page_number)

              pages.append({
                  "page": page_number,
                  "text": raw_text
              })

              for line_number, line in enumerate(
                  raw_text.splitlines(),
                  start=1
              ):
                  clean_line = re.sub(
                      r"\s+",
                      " ",
                      line
                  ).strip()

                  if not clean_line:
                      continue

                  normalized_line = clean_line.casefold()

                  for section, patterns in section_patterns.items():
                      for pattern in patterns:
                          if pattern in normalized_line:
                              heading_candidates.append({
                                  "section": section,
                                  "page": page_number,
                                  "line": line_number,
                                  "text": clean_line
                              })

          result = {
              "recommendation_id": recommendation_id,
              "total_pages": len(reader.pages),
              "total_characters": total_characters,
              "empty_pages": empty_pages,
              "pages": pages,
              "heading_candidates": heading_candidates
          }

          with open(
              "extraction_750_2.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("\n========== ОБЩИЕ РЕЗУЛЬТАТЫ ==========")
          print("Всего страниц:", len(reader.pages))
          print("Всего символов:", total_characters)
          print("Страницы без текста:", empty_pages)

          print("\n========== НАЙДЕННЫЕ РАЗДЕЛЫ ==========")

          for item in heading_candidates:
              print(
                  f"Страница {item['page']} | "
                  f"{item['section']} | "
                  f"{item['text']}"
              )

          print("\n========== ФРАГМЕНТЫ ДЛЯ АНАЛИЗА ==========")

          printed_pages = set()

          for item in heading_candidates:
              page_number = item["page"]

              if page_number in printed_pages:
                  continue

              printed_pages.add(page_number)

              page_text = pages[page_number - 1]["text"]

              print("\n" + "=" * 60)
              print("СТРАНИЦА:", page_number)
              print("НАЙДЕННЫЙ ЗАГОЛОВОК:", item["text"])
              print("ТЕКСТ СТРАНИЦЫ:")
              print(page_text[:2500])

          print("\n========== ПЕРВЫЕ ПЯТЬ СТРАНИЦ ==========")

          for item in pages[:5]:
              print("\n" + "=" * 60)
              print("СТРАНИЦА:", item["page"])
              print(item["text"][:1500])

          print("\n========== ИТОГ ==========")
          print("Кандидатов на заголовки:", len(heading_candidates))
          print("Страниц с текстом:", len(pages) - len(empty_pages))
          print("JSON-файл сформирован.")
          print("ТЕСТ ЗАВЕРШЁН")
          PY

      - name: Сохранить извлечённый текст
        uses: actions/upload-artifact@v4
        with:
          name: extraction-750-2
          path: extraction_750_2.json
