name: Диагностика доступа к API Минздрава

on:
  push:
    paths:
      - "api-diagnostic-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Проверить доступность официального сайта и PDF API
        run: |
          python - <<'PY'
          import json
          import socket
          import time
          from datetime import datetime, timezone
          import requests

          hosts = ["cr.minzdrav.gov.ru", "apicr.minzdrav.gov.ru"]
          report = {"checked_at": datetime.now(timezone.utc).isoformat(), "dns": {}, "requests": []}

          for host in hosts:
              try:
                  report["dns"][host] = sorted({x[4][0] for x in socket.getaddrinfo(host, 443)})
              except Exception as e:
                  report["dns"][host] = {"error": str(e)}

          session = requests.Session()
          session.headers.update({
              "User-Agent": "ClinicalRecommendationsCatalog/1.0 (+https://github.com/89158142819/clinical-recommendations)",
              "Accept": "application/pdf,text/html,*/*",
          })

          checks = [
              ("official_catalog", "https://cr.minzdrav.gov.ru/"),
              ("pdf_lowercase_id_first", "https://apicr.minzdrav.gov.ru/api.ashx?id=749_2&op=GetClinrecPdf"),
              ("pdf_operation_first", "https://apicr.minzdrav.gov.ru/API.ashx?op=GetClinrecPdf&id=749_2"),
              ("pdf_other_known_id", "https://apicr.minzdrav.gov.ru/api.ashx?id=326_3&op=GetClinrecPdf"),
              ("pdf_osteogenesis", "https://apicr.minzdrav.gov.ru/api.ashx?id=520_2&op=GetClinrecPdf"),
          ]

          for name, url in checks:
              item = {"name": name, "url": url}
              started = time.monotonic()
              try:
                  response = session.get(url, timeout=(12, 35), allow_redirects=True)
                  item.update({
                      "status_code": response.status_code,
                      "content_type": response.headers.get("Content-Type"),
                      "bytes": len(response.content),
                      "is_pdf": response.content.startswith(b"%PDF"),
                      "final_url": response.url,
                      "elapsed_seconds": round(time.monotonic() - started, 2),
                  })
                  if not item["is_pdf"] and name != "official_catalog":
                      item["body_sample"] = response.text[:300]
              except Exception as e:
                  item.update({
                      "error": repr(e),
                      "elapsed_seconds": round(time.monotonic() - started, 2),
                  })
              report["requests"].append(item)
              print(json.dumps(item, ensure_ascii=False))

          with open("api-diagnostic-report.json", "w", encoding="utf-8") as f:
              json.dump(report, f, ensure_ascii=False, indent=2)

          print("\nИТОГОВЫЙ ОТЧЁТ:")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Сохранить диагностический отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minzdrav-api-diagnostic
          path: api-diagnostic-report.json
          if-no-files-found: warn
          retention-days: 30
