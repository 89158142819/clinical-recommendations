
name: Проверка структуры рекомендации

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы проекта
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить библиотеки
        run: pip install -r requirements.txt

      - name: Скачать рекомендацию
        run: python download_one.py

      - name: Найти заголовки
        run: python inspect_headings.py

      - name: Сохранить результаты
        uses: actions/upload-artifact@v4
        with:
          name: analysis-749-2
          path: |
            output/749_2.json
            output/headings.txt
          if-no-files-found: error
