name: Тест структурирования диагностики

on:
  push:
    paths:
      - "extract_sections_v2.py"
      - "diagnostic_enrichment.py"
      - "test_diagnostic_enrichment.py"
      - "download_batch.py"
      - "test_diagnostic_extraction.py"
      - ".github/workflows/test-diagnostic-extraction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы проекта
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Проверить синтаксис парсера
        run: python -m py_compile extract_sections_v2.py diagnostic_enrichment.py publish_site.py

      # Проверка v7: разделяем карточки только при смене вердикта и наличии обеих полярностей
      - name: Проверить новые поля диагностических карточек
        run: python test_diagnostic_enrichment.py

      - name: Проверить структурирование на целиакии
        run: python test_diagnostic_extraction.py

      - name: Сохранить результат теста
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-regression-results
          path: diagnostic_regression_results.json
