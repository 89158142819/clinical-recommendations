name: Тест очистки на реальных клинических рекомендациях

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-cleaner-samples.yml"
      - "tests/test_real_pdf_samples.py"
      - "tests/test_text_cleaner_split_words.py"
      - "requirements.txt"
      - "text_cleaner.py"
      - "download_batch.py"
      - "extract_sections_v2.py"

permissions:
  actions: read
  contents: read

jobs:
  test-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Получить файлы проекта
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Скачать архив с первыми контрольными PDF
        uses: actions/download-artifact@v4
        with:
          name: clinical-recommendations-batch-0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 41186718385
          path: samples/batch0

      - name: Скачать архив со вторым набором контрольных PDF
        uses: actions/download-artifact@v4
        with:
          name: clinical-recommendations-batch-10
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 41188581569
          path: samples/batch10

      - name: Скачать архив с компактной клинической рекомендацией
        uses: actions/download-artifact@v4
        with:
          name: clinical-recommendations-batch-40
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 41314075250
          path: samples/batch40

      - name: Скачать архив с документом в римской нумерации глав
        uses: actions/download-artifact@v4
        with:
          name: clinical-recommendations-batch-90
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 41324291148
          path: samples/batch90

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проверить синтаксис
        run: |
          python -m py_compile text_cleaner.py download_batch.py extract_sections_v2.py tests/test_real_pdf_samples.py tests/test_text_cleaner_split_words.py

      - name: Проверить восстановление слов, разорванных PDF
        run: python tests/test_text_cleaner_split_words.py

      - name: Повторно извлечь текст из реальных PDF и проверить парсер
        run: |
          python tests/test_real_pdf_samples.py

      - name: Сохранить результаты тестирования
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-clinical-recommendations-real-pdf-tests
          path: output/
          if-no-files-found: warn
          retention-days: 14
