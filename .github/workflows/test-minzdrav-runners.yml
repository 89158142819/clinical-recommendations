name: Проверка доступа к Минздраву на разных GitHub runners

on:
  push:
    paths:
      - "runner-network-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Проверить DNS и HTTPS
        shell: bash
        run: |
          python - <<'PY'
          import socket
          import time
          import urllib.request
          import urllib.error

          hosts = ["cr.minzdrav.gov.ru", "apicr.minzdrav.gov.ru"]
          for host in hosts:
              try:
                  ips = sorted({x[4][0] for x in socket.getaddrinfo(host, 443)})
                  print(f"DNS {host}: {ips}", flush=True)
              except Exception as e:
                  print(f"DNS ERROR {host}: {e}", flush=True)

          urls = [
              "https://cr.minzdrav.gov.ru/",
              "https://apicr.minzdrav.gov.ru/api.ashx?id=749_2&op=GetClinrecPdf",
          ]
          for url in urls:
              start = time.monotonic()
              req = urllib.request.Request(url, headers={"User-Agent": "ClinicalRecommendationsCatalog/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=12) as response:
                      data = response.read(1024)
                      print(f"HTTP {response.status}; first_bytes={len(data)}; pdf={data.startswith(b'%PDF')}; elapsed={time.monotonic()-start:.1f}s; url={url}", flush=True)
              except Exception as e:
                  print(f"ERROR {type(e).__name__}: {e}; elapsed={time.monotonic()-start:.1f}s; url={url}", flush=True)
          PY
