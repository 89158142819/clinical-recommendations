
name: Тест загрузки и извлечения текста PDF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы проекта
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить библиотеки
        run: pip install requests pypdf

      - name: Проверить извлечение текста из разных страниц
        run: |
          python - <<'PY'
          import requests
          from pypdf import PdfReader
          from io import BytesIO

          recommendation_id = "750_2"

          url = (
              "https://apicr.minzdrav.gov.ru/API.ashx"
              f"?op=GetClinrecPdf&id={recommendation_id}"
          )

          print("Загружаем рекомендацию:", recommendation_id)

          response = requests.get(url, timeout=120)
          response.raise_for_status()

          assert response.content.startswith(b"%PDF"), (
              "Сервер не вернул PDF"
          )

          reader = PdfReader(BytesIO(response.content))

          print("Количество страниц:", len(reader.pages))

          pages_to_check = [0, 49, 103]

          total_characters = 0

          for page_number in pages_to_check:
              text = reader.pages[page_number].extract_text() or ""

              total_characters += len(text)

              print("\n" + "=" * 50)
              print("СТРАНИЦА:", page_number + 1)
              print("Символов:", len(text))
              print(text[:1500])

              assert len(text.strip()) > 0, (
                  f"На странице {page_number + 1} нет текста"
              )

          print("\n" + "=" * 50)
          print("Всего символов на проверенных страницах:", total_characters)
          print("ТЕСТ УСПЕШНО ЗАВЕРШЁН")
          PY
